
<script :setup>
  const { opfsService } = await import('./services/opfs.service.js');

  console.log('Component79 version is ', Component79.version);

  const [
      CHeader,
      DropForm,
      CFooter,
  ] = await Component79.fetchAll([
      './layout/header.html',
      './components/DropForm.html',
      './layout/footer.html',
  ]);

  await opfsService.readFilesInOPFS();

  const store = $reactive({
    files: [...opfsService.filesInOPFS],
  });

  const onFiles = async ({ detail: files }) => {
    console.log('Files dropped:', files);

    for (const file of files) {
      await opfsService.writeFileToOPFS(file);
    }
    // re-read rather than append, so dropping the same name twice doesn't
    // duplicate the row that OPFS just overwrote
    store.files = await opfsService.readFilesInOPFS();
  }
</script>

<CHeader />
<section main>
  <DropForm
    @files="onFiles"
  />

  <ul>
    <li :each="file in store.files">{{file.name}}</li>
  </ul>
</section>
<CFooter />
