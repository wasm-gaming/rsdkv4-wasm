
<script :setup>
  const { opfsService = {} } = await import('./services/opfs.service.js');
  const { gameService = {} } = await import('./services/game.service.js');

  const GameSelector = await import('./views/GameSelector.html')
  const GameLauncher = await import('./views/GameLauncher.html')

  // The id doubles as the OPFS folder name under rsdkv4/, so it has to match the
  // SDK's casing (src/demo/library.ts GAMES) — OPFS is case-sensitive.
  console.log('Component79 version is ', Component79.version);

  $: anyGameLoaded = Object
      .entries(gameService.games)
      .some(([gameId, game]) => game.loaded)

  $: $('body').classList.toggle('is-launched', gameService.isLaunched)
  $: $('body').classList.toggle('is-running', gameService.isRunning)

  const [
      CHeader,
      DropForm,
      EscMenu,
      CFooter,
  ] = await Component79.fetchAll([
      './layout/header.html',
      './components/DropForm.html',
      './components/EscMenu.html',
      './layout/footer.html',
  ]);

  // await opfsService.readFilesInOPFS();

  await gameService.init();

  // El `@files` de la cabecera y el que emite DropForm traen un FileList;
  // addDataFile reconoce el juego por CRC32, así que no hace falta decírselo.
  const onFiles = ({ detail: files } = {}) => {
    for (const file of files ?? []) gameService.addDataFile(file)
  }

  const onLaunch = ({ detail: {
    slot = null,
    player = 0, // Sonic
  } = {} } = {}) => {
    console.log('detail', {
      slot,
      player,
    })
    gameService.launchGame($('canvas'), {
      slot, player,
    })
  }
</script>

<CHeader
  @files="onFiles"
/>
<DropForm
  @files="onFiles"
/>
<section main>
  <div canvas :running="gameService.isRunning ? '' : null">
    <canvas></canvas>
  </div>
  <div container>
    <GameSelector />
    <div :if="!anyGameLoaded">
      Drop game Data.rsdk
    </div>
    <GameLauncher
      :elseif="gameService.selectedGame"
      @launch="onLaunch"
    />
    <div :else>
      Choose a game to play
    </div>
  </div>
</section>
<EscMenu />
<CFooter />
