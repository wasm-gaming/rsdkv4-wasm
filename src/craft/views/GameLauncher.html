
<script :setup>
    const { gameService, describeSlot, emeraldCount } = await import('../services/game.service.js');

    const players = [
        'sonic',
        'tails',
        'knuckles',
        'sonictails',
    ];
    let selectedPlayer = [0, 1, 2, 3];

    const nextPlayer = (i) => {
        const nextPlayerIndex = selectedPlayer[i] + 1;

        selectedPlayer[i] = players[nextPlayerIndex]
            ? nextPlayerIndex
            : 0;
    };

    const getSaveSlot = (i) => {
        const savegame = gameService.selectedGame?.savegame;
        if (!savegame || !savegame[i] || savegame[i].empty) return null;
        return savegame[i];
    };

    // Zona, acto y retrato de un slot. Ojo: el save guarda el índice de ESCENA, no
    // el de zona (Scrap Brain 3 es la escena 17), así que la traducción vive en el
    // servicio, junto a la tabla que salió del propio pack.
    const stage = (i) => describeSlot(getSaveSlot(i), gameService.selectedGame?.id) ?? {};

    // Cuántas de las siete se llevan. El save cuenta, no dice cuáles.
    const emeralds = (i) => emeraldCount(getSaveSlot(i)?.emeralds ?? 0);
</script>

<section game-launcher>
    <div slot-cards>
        <button
            type="button"
            slot-card no-save
            @click="$emit('launch', {
                slot: null,
                player: 1,
            })"
        >
            NO SAVE
        </button>

        <!-- `i` es el índice 0-based del :each, y RSDKv4 numera sus cuatro slots
             0-3 — que es justo lo que espera game.start(slot, player). -->
        <div :each="slotNum, i in [1, 2, 3, 4]" slot-card in-memory>
            <div :if="getSaveSlot(i)" slot-info>
                <div stage-shot>
                    <div stage-badge>
                        <img :if="stage(i).img" :src="stage(i).img" :alt="stage(i).name" />
                    </div>
                    <div zone-tag>{{ stage(i).tag }}</div>
                    <div player-icon :player="players[getSaveSlot(i).character] || 'sonic'">
                        <img :src="`./assets/player-${players[getSaveSlot(i).character] || 'sonic'}.svg`" />
                    </div>
                </div>
                <div zone-title :title="`${stage(i).name} · act ${stage(i).act}`">
                    {{ stage(i).name }}
                </div>
                <!-- Las siete, siempre; se encienden las conseguidas. -->
                <div emeralds :title="`${emeralds(i)} of 7 chaos emeralds`">
                    <i :each="gem in [0, 1, 2, 3, 4, 5, 6]"
                       :gem="gem"
                       :owned="gem < emeralds(i) ? '' : null"></i>
                </div>
                <div stats-grid>
                    <span stat-item title="Lives">❤️ {{ getSaveSlot(i).lives }}</span>
                    <span stat-item title="Score">⭐ {{ getSaveSlot(i).score }}</span>
                </div>
                <button type="button" play @click="$emit('launch', {
                    slot: i,
                    player: getSaveSlot(i).character,
                })">
                    CONTINUE
                </button>
            </div>
            <div :else slot-new>
                <button type="button" player-choose @click="nextPlayer(i)" :player="players[selectedPlayer[i]]">
                    <img :src="`./assets/player-${players[selectedPlayer[i]]}.svg`" />
                </button>
                <button type="button" play @click="$emit('launch', {
                    slot: i,
                    player: selectedPlayer[i],
                })">
                    PLAY
                </button>
            </div>
        </div>
    </div>
</section>

<style>
    :root {
        --player-bg-grey: rgba(180, 180, 180, .2);
        --player-bg-sonic: rgba(13, 122, 233, .2);
        --player-bg-tails: rgba(241, 176, 0, .2);
        --player-bg-knuckles: rgba(255, 20, 0, .2);
        --player-bg-sonictails: rgba(160, 32, 240, .2);
    }

    @keyframes player-bg {
        0% { left: 30%; right: 20%; }
        10% { left: 50%; right: 50%; }
        20% { left: 10%; right: 20%; }
        30% { left: 60%; right: 40%; }
        40% { left: 70%; right: 10%; }
        50% { left: 20%; right: 80%; }
        60% { left: 10%; right: 0; }
        60% { left: 0; right: 60%; }
        70% { left: 40%; right: 10%; }
        80% { left: 10%; right: 70%; }
        90% { left: 80%; right: 0; }
        100% { left: 30%; right: 20%; }
    }

    [game-launcher] {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 100%;
        transform: translateY(2rem);
        position: relative;
        z-index: 1;
    }

    [slot-cards] {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 1.5rem;
        margin-bottom: -2rem;
    }

    [slot-card] {
        width: 170px;
        height: 220px;
        background: #333;
        color: white;
        appearance: none;
        border-radius: .5rem;
        border: 2px solid black;

        &[no-save] {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 130px;
            cursor: pointer;

            &:hover:not(:active) {
                background: #222;
            }
        }
    }

    [slot-card][in-memory] {
        display: flex;
        flex-direction: column;
        padding: .75rem;
        box-sizing: border-box;

        [slot-info], [slot-new] {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            gap: 0.4rem;
        }

        /* Cinco bloques en 192px: la foto 16/9 se lleva 80 y CHEMICAL PLANT ZONE
           ocupa dos líneas, así que el hueco entre ellos se aprieta un poco. */
        [slot-info] {
            gap: 0.25rem;
        }

        /* El marco del retrato: la foto manda el tamaño y todo lo demás se apoya
           encima. Es quien lleva el position, porque el icono del personaje se sale
           de la foto y no puede vivir dentro de su overflow: hidden. */
        [stage-shot] {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        [stage-badge] {
            width: 100%;
            /* La proporción se mide sobre el borde: con content-box los 2px del
               marco se suman y la foto deja de ser 16/9. */
            box-sizing: border-box;
            aspect-ratio: 16 / 9;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Sonic 2 tiene doce zonas y diez fotos: Death Egg e Hidden Palace se
               quedan sin imagen, y este fondo es lo que se ve en su lugar. */
            background: linear-gradient(160deg, #1b2a4a, #080d1c);

            img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: brightness(0.9);
                image-rendering: pixelated;
                image-rendering: crisp-edges;
            }
        }

        /* El número de zona, sobre la foto y fuera del camino del nombre. */
        [zone-tag] {
            position: absolute;
            top: 4px;
            left: 4px;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.72);
            color: #fbbf24;
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            line-height: 1.4;
        }

        [player-icon] {
            position: absolute;
            right: 0;
            bottom: -1rem;
            display: flex;
            align-items: flex-end;
            /* Decorativo: quien elige personaje es la tarjeta de NEW GAME. En una
               partida empezada esto sólo dice con quién se iba. */
            pointer-events: none;

            img {
                height: 64px;
                width: auto;
                filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.85));
            }
        }

        [zone-title] {
            /* Dos líneas reservadas siempre. CHEMICAL PLANT ZONE necesita dos y
               GREEN HILL ZONE una; sin reservarlas, las filas de debajo bailan de
               una tarjeta a otra y la de nombre largo se salía por abajo. */
            height: 2.3em;
            font-weight: 800;
            font-size: 0.72rem;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            text-align: left;
            line-height: 1.15;
        }

        /* Las siete esmeraldas, en su fila. Las que faltan llevan su color de
           siempre a media luz: se ve cuál cae después, no un hueco. */
        [emeralds] {
            display: flex;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;

            i {
                width: 11px;
                height: 11px;
                clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
                opacity: 0.2;
            }

            i[owned] {
                opacity: 1;
                filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
            }

            i[gem='0'] { background: #58e058; }
            i[gem='1'] { background: #f0a038; }
            i[gem='2'] { background: #f078d8; }
            i[gem='3'] { background: #9878f0; }
            i[gem='4'] { background: #f0f0f0; }
            i[gem='5'] { background: #f07878; }
            i[gem='6'] { background: #78c0f8; }
        }

        [stats-grid] {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.2rem 0.4rem;
            font-size: 0.68rem;
            color: #e2e8f0;

            [stat-item] {
                display: inline-flex;
                align-items: center;
                gap: 0.2rem;
                background: rgba(0, 0, 0, 0.4);
                padding: 0.1rem 0.3rem;
                border-radius: 3px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        button[player-choose] {
            all: unset;
            box-sizing: border-box;
            width: 100%;
            padding: 1rem .5rem 0;
            cursor: pointer;
            background: white;
            aspect-ratio: 1 / 1;
            transition: padding .05s linear;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            &::before, &::after {
                content: '';
                position: absolute;
                inset: 0 1rem 0 3rem;
                background: var(--player-bg-grey);
                z-index: 0;
            }

            &:hover {
                background-color: white;

                &::before {
                    animation: player-bg 20s linear infinite;
                }
                &::after {
                    animation: player-bg 30s linear reverse infinite;
                }
            }

            &[player=sonic]::after {
                background: var(--player-bg-sonic);
                left: 30%; right: 20%;
            }
            &[player=tails]::after {
                background: var(--player-bg-tails);
                animation-delay: -5s;
                left: 40%; right: 10%;
            }
            &[player=knuckles]::after {
                background: var(--player-bg-knuckles);
                animation-delay: -10s;
                left: 20%; right: 30%;
            }
            &[player=sonictails]::after {
                background: var(--player-bg-sonictails);
                animation-delay: -15s;
                left: 20%; right: 70%;
            }

            img {
                position: relative;
                z-index: 1;
            }
        }

        &:hover button[player-choose] {
            padding: 0;
        }

        button[play] {
            appearance: none;
            border: none;
            background: royalblue;
            color: white;
            font-weight: bold;
            height: 34px;
            width: 100%;
            box-sizing: border-box;
            /* CONTINUE y PLAY miden lo mismo pase lo que pase por encima: sin esto,
               una tarjeta con stats a dos líneas desborda la columna y flexbox le
               recorta unos píxeles de alto solo al CONTINUE. Que ceda el badge, que
               es una imagen con object-fit y no se nota. */
            flex-shrink: 0;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 0 0 2px black;

            &:hover:not(:active) {
                background: blue;
            }
        }

        img {
            display: block;
        }
    }
</style>
