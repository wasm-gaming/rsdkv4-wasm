<!-- RSDKv4 launcher — replaces the shared template's single-ROM launcher.
     Copied over dist/demo/components/launcher.html by `make build-demo`, so the
     rest of the shared demo (sdk-info, esc-menu, launch flow) stays untouched:
     demo.js fetches this file by path and still gets `launch` emitted from it.

     One WASM plays both games, the Data.rsdk decides which — so this is a
     two-slot library instead of one ROM picker. Storage lives in
     window.rsdkv4Library (src/demo/library.ts), which writes each pack straight
     into the folder the engine later uses as its working dir. -->

<form class="launcher" @submit.prevent="onLaunch">
  <section class="sdk">
    <CSdkInfo ...sdkInfo :messages="messages" />
  </section>

  <p class="library-hint">{{ messages.libraryHint || "Drop each game's Data.rsdk once — it stays in your browser." }}</p>

  <div class="games">
    <article
      :each="game in games"
      :key="game.id"
      class="game"
      role="button"
      tabindex="0"
      :class="{ installed: game.installed, selected: game.id === selectedId, dropping: game.id === droppingId }"
      @click="selectedId = game.id"
      @keydown="$event.key === 'Enter' && (selectedId = game.id)"
      @dblclick="onLaunch"
      @dragover.prevent="droppingId = game.id"
      @dragleave="droppingId = null"
      @drop.prevent="onDrop($event, game.id)"
    >
      <header>
        <span class="tag">{{ game.short }}</span>
        <span class="year">{{ game.year }}</span>
      </header>

      <h3>{{ game.title }}</h3>

      <p class="state" :if="game.installed">
        {{ formatSize(game.size) }} · {{ storagePath(game.id) }}
      </p>
      <p class="state empty" :else>
        {{ messages.slotEmpty || 'No Data.rsdk yet — drop one here' }}
      </p>

      <div class="actions">
        <label class="picker">
          {{ game.installed ? (messages.changeFileButton || 'Replace') : (messages.pickRomButton || 'Pick Data.rsdk') }}
          <input type="file" accept=".rsdk" :attrs="{ disabled: busy }" @change="onPick($event, game.id)" />
        </label>
        <button type="button" class="remove-btn" :if="game.installed" :attrs="{ disabled: busy }" @click.stop="onRemove(game.id)">
          {{ messages.removeFileButton || 'Remove' }}
        </button>
      </div>
    </article>
  </div>

  <button type="submit" class="launch-btn" :attrs="{ disabled: !canLaunch }">
    {{ messages.launchButton || 'Play' }}
  </button>

  <div class="status">{{ statusLine }}</div>
</form>

<script :setup="{
  CSdkInfo,
  sdkInfo,
  messages = {},
}">
  // Set by src/demo/demo.ts before demo.init() runs. Setup scripts are compiled
  // with `new Function`, so there is no module scope to import into.
  const library = window.rsdkv4Library;

  // Last known state, so the slots render immediately; the OPFS probe below
  // fills in what is actually stored (assignments from .then() are reactive).
  let games = library ? library.slots() : [];
  // The library only pre-selects an installed game; with an empty shelf, point
  // at the first slot anyway so the status line can name what it's asking for.
  let selectedId = (library && library.selected()) || (games[0] && games[0].id) || null;

  let droppingId = null;
  let busy = false;
  // Transient message (saving, launching, failure); when empty the status line
  // falls back to describing the current selection.
  let notice = "";

  if (library) {
    library.refresh().then((slots) => {
      games = slots;
      selectedId = library.selected() || selectedId;
    });
  }

  $: selectedSlot = games.find((game) => game.id === selectedId) || null;
  $: canLaunch = !busy && Boolean(selectedSlot && selectedSlot.installed);
  $: statusLine = notice
    ? notice
    : selectedSlot && selectedSlot.installed
      ? `${messages.statusReady || 'Ready to launch!'} (${selectedSlot.title})`
      : selectedSlot
        ? `${selectedSlot.short}: ${messages.statusSelectRom || 'drop its Data.rsdk to play it.'}`
        : messages.statusSelectAny || 'Drop a Data.rsdk on a slot to begin.';

  const formatSize = (bytes) =>
    bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.round(bytes / 1024)} KB`;

  const storagePath = (id) => (library ? `${library.storageNamespace(id)}/Data.rsdk` : "");

  const install = async (id, file) => {
    if (!file || busy || !library) return;
    busy = true;
    notice = `${messages.savingStatus || 'Storing'} ${file.name}…`;
    try {
      games = await library.install(id, file);
      selectedId = library.selected();
      notice = "";
    } catch (error) {
      notice = `${messages.saveFailed || 'Could not store the file'}: ${error && error.message ? error.message : error}`;
    } finally {
      busy = false;
    }
  };

  const onPick = (event, id) => {
    const input = event.target;
    const file = input.files && input.files.item(0);
    // Let the same file be picked again after a remove: without this the input
    // keeps the old value and fires no change event.
    input.value = "";
    if (file) install(id, file);
  };

  const onDrop = (event, id) => {
    droppingId = null;
    const file = event.dataTransfer && event.dataTransfer.files.item(0);
    if (file) install(id, file);
  };

  const onRemove = async (id) => {
    if (busy || !library) return;
    const slot = games.find((game) => game.id === id);
    const question = messages.removeConfirm || 'Remove the stored Data.rsdk for';
    if (typeof confirm === "function" && !confirm(`${question} ${slot ? slot.title : id}?`)) return;
    busy = true;
    try {
      games = await library.remove(id);
      // Stay on the slot that was just emptied unless another game is installed,
      // so the status line explains what it now wants.
      selectedId = library.selected() || id;
      notice = "";
    } finally {
      busy = false;
    }
  };

  const onLaunch = () => {
    if (!canLaunch) return;
    library.select(selectedId);
    notice = `${messages.launchingStatus || 'Launching with'} ${selectedSlot.title}…`;
    // The shared demo.js reads `{ rom, bios }` from this payload; both are null
    // here because the pack is already in OPFS — index.html's launch handler
    // asks the library which game was picked and hands the SDK a namespace.
    $emit("launch", { rom: null, bios: null, game: selectedId });
  };
</script>
