<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>RSDKv4 SDK — demo</title>

  <!-- Cross-origin isolation: on static hosts that cannot send the headers,
       this service worker adds COOP/COEP from inside the browser. Must load
       before anything else, since it may trigger a reload. -->
  <script src="./coi.js"></script>

  <link rel="stylesheet" href="./demo/demo.css" />
  <link rel="stylesheet" href="./theme.rsdkv4.css" />

  <!-- The demo imports the SDK by its package name; the import map resolves it to
       the built files sitting next to this HTML in dist/. This mirrors how a real
       host consumes the package. -->
  <script type="importmap">
    {
      "imports": {
        "@wasm-gaming/rsdkv4-wasm": "./rsdkv4/rsdkv4.sdk.js",
        "@wasm-gaming/engine-specs": "./demo/demo.sdk.js"
      }
    }
  </script>
</head>
<body>
  <main></main>

  <!-- Engine-specific bootstrap: sets window.SDK + window.rsdkv4Library, then the
       inline module below boots the shared template. -->
  <script type="module" src="./demo.js"></script>

  <script type="module">
    import demo from './demo/demo.js'
    import { mountStartScreens } from './start-screens.js'

    // src/demo/library.ts, published on window by demo.js above. It owns the two
    // Data.rsdk slots in OPFS (rsdkv4/Sonic1/, rsdkv4/Sonic2/) and the launcher
    // component renders from it — including the OPFS probe, which is why nothing
    // is awaited here: the template's demo.js arms a `setTimeout(demo.init, 0)`
    // fallback on import, so init() has to be called in this same tick or the
    // page boots twice (once with the default config).
    const library = window.rsdkv4Library

    // Pause overlay config. Both `title` and `optionGroups` are filled in on
    // launch, before the handler returns — the template reads them right after,
    // when it mounts the overlay.
    const escMenu = { enabled: true }

    /**
     * The pause overlay's "Jump to" buttons.
     *
     * Deliberately short: the full stage list is 30+ scenes, and what a player
     * wants from a pause menu is the way out (title screen), the game's own
     * pickers (stage menu / level select) and the special stages. Each entry is
     * looked up by name in the engine's real stage list, so a pack that names
     * things differently drops the buttons it hasn't got rather than warping
     * somewhere random.
     *
     * These are the overlay's `items`, not option rows: the template closes the
     * menu before running an item's action, so the engine is already resumed
     * when the warp is issued and the stage loads straight away.
     */
    function buildJumpButtons(instance) {
      const lists = instance.devMenu.getStageList()
      const jump = (list, stage) => () => instance.devMenu.loadStage(list, stage)

      const byName = (listIdx, name) => {
        const stages = lists[listIdx]?.stages ?? []
        const index = stages.findIndex((stage) => stage.name.trim().toUpperCase() === name)
        return index < 0 ? null : { label: stages[index].name, action: jump(listIdx, index) }
      }

      // 0 = presentation, 1 = regular, 3 = special (STAGELIST_* in Scene.hpp).
      const items = [byName(0, 'TITLE SCREEN'), byName(1, 'STAGE MENU'), byName(0, 'LEVEL SELECT')]
      lists[3]?.stages?.forEach((stage, index) => {
        items.push({ label: `Special ${index + 1}`, action: jump(3, index) })
      })

      return items.filter(Boolean)
    }

    /**
     * The engine's own GAME OPTIONS screen — spindash, speed caps, item boxes,
     * super forms — as live option rows. Sonic 1 and Sonic 2 expose different
     * ones, so this follows whatever the running pack reports.
     */
    function buildEscMenuGroups(instance) {
      const gameOptions = instance.game.options().map((option) => ({
        key: `opt:${option.key}`,
        label: option.label,
        description: 'RSDKv4 game option. Saved with the game, exactly as the engine’s own menu saves it.',
        type: option.type,
        value: option.type === 'boolean' ? Boolean(option.value) : option.value,
        ...(option.values
          ? { values: option.values.map((label, index) => ({ value: index, label })) }
          : {}),
      }))

      return gameOptions.length ? [{ id: 'game', label: 'Game options', options: gameOptions }] : []
    }

    const startScreens = { mount: mountStartScreens }

    // Logos for the save-select screen (src/demo/assets, copied to dist/assets
    // by the Makefile). A game without one just gets its name in type.
    const GAME_LOGOS = {
      Sonic1: './assets/Sonic_The_Hedgehog.svg',
    }

    demo
      .init({
        messages: {
          title: 'RSDKv4 — Sonic 1 & 2',
          libraryHint: "Drop each game's Data.rsdk once — it is stored in your browser and never uploaded.",
          slotEmpty: 'No Data.rsdk yet — drop one here',
          pickRomButton: 'Pick Data.rsdk',
          changeFileButton: 'Replace',
          removeFileButton: 'Remove',
          removeConfirm: 'Remove the stored Data.rsdk for',
          savingStatus: 'Storing',
          saveFailed: 'Could not store the file',
          statusReady: 'Ready to launch!',
          statusSelectRom: 'drop its Data.rsdk to play it.',
          statusSelectAny: 'Drop a Data.rsdk on a slot to begin.',
          launchButton: 'Play',
          launchingStatus: 'Launching',
          escMenuTitle: 'Settings',
          escMenuResume: 'Resume',
          escMenuReset: 'Reset game',
          escMenuRestoreDefaults: 'Restore defaults',
          escMenuExit: 'Exit to Launcher',
        },
        bios: false,
        escMenu,
      })
      .on('launch', async (e) => {
        const SDK = window.SDK
        if (!SDK) throw new Error('SDK not loaded')

        const game = library.selectedGame()
        if (!game) throw new Error('No game selected')

        escMenu.title = `${game.short} — Settings`

        const instance = await SDK.load({
          attachTo: e.attachTo,
          // The pack already sits in OPFS at rsdkv4/<game>/Data.rsdk, which is
          // the very directory the engine mounts as its working dir — so no
          // assets are handed over and nothing is copied. dataProvider is the
          // fallback for when the WASM side can't reach OPFS itself (no
          // cross-origin isolation, or a build without Asyncify/JSPI — which is
          // today's, see the OPFS caveat in the README) and needs the bytes
          // read from JS instead. That path is the one in use right now.
          storageNamespace: library.storageNamespace(game.id),
          dataProvider: () => library.readBytes(game.id),
          // The save-slot and character screens are drawn in HTML below, so the
          // engine's own text menus are switched off.
          options: { skipStartMenu: true },
          onEvent(event) {
            if (event.type === 'error') {
              console.error(event.error)
            }
          },
        })

        instance.start()

        // The pause overlay's contents are the engine's, not the template's. The
        // stock rows (image filtering, aspect ratio, audio…) come from its
        // generic-emulator config and are wired to nothing in RSDKv4, so they
        // are replaced rather than shown as controls that do nothing:
        //   · "Jump to" buttons — warps via the dev-menu bridge (WebDevMenu.cpp),
        //     each one closing the menu and landing immediately
        //   · "Game options" rows — the engine's own GAME OPTIONS screen, read
        //     and written through instance.game (WebGame.cpp), same globals and
        //     same save file the native menu uses.
        escMenu.onOptionChange = (key, value) => {
          const option = key.startsWith('opt:') ? key.slice(4) : null
          if (option) instance.game.setOption(option, value === true ? 1 : value === false ? 0 : Number(value))
        }

        escMenu.optionGroups = buildEscMenuGroups(instance)
        escMenu.items = buildJumpButtons(instance)

        // One save-select screen — file and character in the same place —
        // instead of the engine's own text menus (which is why it boots with
        // skipStartMenu). It pauses the engine while it is up and starts the
        // game on the way out.
        startScreens.mount(e.attachTo, instance, {
          title: game.title,
          logo: GAME_LOGOS[game.id],
        })

        return instance
      })
      // Pause ownership: the overlay pauses as 'menu', so closing it will not
      // resume a game that something else (the start screens, a host pause) had
      // already frozen. Only the owner of a pause can lift it.
      .on('esc', ({ open, instance }) => {
        if (!instance) return
        if (open) instance.pause('menu')
        else instance.resume('menu')
      })
  </script>
</body>
</html>
