name: Build

# Builds the two halves of a release and leaves them as artifacts. What
# happens to them afterwards — Release assets, npm, Pages — belongs to
# release.yml, which calls this workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to stamp across package.json, the lockfile and Rsdkv4SDK.version
          before building. Blank builds whatever the checkout says, which is what
          a PR wants.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # `github.workflow` is the *caller's* name when this runs through
  # workflow_call, so a release building main lands in its own group instead of
  # queueing behind whatever the last push to main is still compiling.
  #
  # Only pull requests get cancelled. A release build is doing work nothing else
  # will redo, and on main the pushes are minutes apart at most.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Stamp the release version into package.json, package-lock.json and the
      # `static readonly version` of Rsdkv4SDK — the three places sync-version
      # writes — so the artifacts carry the version that is about to be tagged.
      - name: Stamp the release version
        if: inputs.version != ''
        run: node scripts/sync-version.mjs "${{ inputs.version }}"
      - name: Install dependencies
        run: npm ci
      - name: Build the package (TypeScript → dist/rsdkv4/)
        run: make build-sdk
      - name: Typecheck
        run: make typecheck

      # Packed here, where the version is already stamped and dist/ is on disk,
      # so the bytes that get published are the bytes that were tested.
      - name: Pack
        run: npm pack

      # …and only then the site: the API reference, the demo and the hosts, which
      # is what the Pages job deploys. `build-sdk` stopped producing any of it
      # when the package and the site were split apart.
      #
      # Last, and deliberately: `make demo` is also the only thing that
      # type-checks the hosts, so a host that has drifted from the SDK fails
      # here — after the tarball is packed, so it cannot hold up the package the
      # way it used to.
      - name: Build the site
        run: make demo

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'

  wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4
      # build.sh runs directly in this container (emcc/make/git/python3/perl are
      # all present in emscripten/emsdk); it does not call Docker itself.
      - name: Build WASM
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist/
